<!DOCTYPE html>
<html>
<head>
    <title>AI Crop Yield Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="font-family: Arial; text-align:center; background:#f2f2f2;">

<h1>🌾 AI Powered Crop Yield Prediction</h1>

<form method="POST">

    <p>Rainfall (mm)</p>
    <input type="number" name="rainfall" required><br><br>

    <p>Temperature (°C)</p>
    <input type="number" name="temperature" required><br><br>

    <p>Humidity (%)</p>
    <input type="number" name="humidity" required><br><br>

    <p>Area (Acres)</p>
    <input type="number" name="area" required><br><br>

    <button type="submit">Predict Crop Yield</button>

</form>

{% if prediction %}
<h2 style="color:green;">
Predicted Crop Yield = {{ prediction }}
</h2>
{% endif %}

</body>
</html>
